[package]
name = "blocklog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Block logging and rollback for Pumpkin by MCSV (CoreProtect-style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p blocklog`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true

# Lab-only sender of the block-change message WorldTools sends (see examples/blocklog_sender.rs); never published.
[[example]]
name = "blocklog_sender"
crate-type = ["cdylib"]
