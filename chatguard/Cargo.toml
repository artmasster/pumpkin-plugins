[package]
name = "chatguard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A chat filter for bad words, adverts and spam, for Pumpkin by MCSV (ChatControl style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p chatguard`.
# Basics asks it about each chat line before it sends one.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
