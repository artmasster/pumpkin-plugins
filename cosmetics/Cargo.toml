[package]
name = "cosmetics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hats, backpacks and balloons players put on themselves, made of models or items, for Pumpkin by MCSV (HMCCosmetics style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p cosmetics`.
# Needs the Models plugin, which draws what players wear.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
