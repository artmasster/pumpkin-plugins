[package]
name = "crops"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Crops of your own that players plant, grow and pick, made of items or models, for Pumpkin by MCSV (CustomCrops style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p crops`.
# Uses the items of CustomItems and the models of Models when those are installed.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
