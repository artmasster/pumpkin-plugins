[package]
name = "discordlink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Discord bridge for Pumpkin by MCSV (DiscordSRV-style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p discordlink`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common = { workspace = true, features = ["http"] }
