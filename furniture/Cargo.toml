[package]
name = "furniture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Furniture that players place, sit on and take back, for Pumpkin by MCSV (ItemsAdder/Nexo furniture style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p furniture`.
# Uses the items of CustomItems, the models of Models and the land of Claims when those are installed.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
