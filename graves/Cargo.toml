[package]
name = "graves"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Graves that keep a player's items where they died, for Pumpkin by MCSV (GravesX style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p graves`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
