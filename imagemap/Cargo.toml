[package]
name = "imagemap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pictures on maps for Pumpkin by MCSV (ImageOnMap-style: an image link becomes map items, posters of many maps)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p imagemap`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Pure-Rust decoders (no C code, so they build for WASM)
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
# `http`: the picture is downloaded from the link the player gives
mcsv-common = { workspace = true, features = ["http"] }
