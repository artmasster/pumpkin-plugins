[package]
name = "jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Jobs that pay money and experience for what players do, for Pumpkin by MCSV (Jobs Reborn style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p jobs`.
# Pays through the Basics plugin (money).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
