[package]
name = "login"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Login for offline-mode Pumpkin servers by MCSV (AuthMe-style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p login`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Pure Rust; the stored string carries its own parameters so they can be raised later
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
getrandom = "0.3"
# AuthMe's default hash, only to let imported accounts log in once (then they are re-hashed)
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
