[package]
name = "market"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A market where players sell items to each other, for Pumpkin by MCSV (AuctionHouse style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p market`.
# Needs the Basics plugin for money.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
