[package]
name = "mobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Custom mobs with their own stats, skills, drops and spawners for Pumpkin by MCSV (MythicMobs style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p mobs`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
