[package]
name = "motd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Server list message and maintenance mode for Pumpkin by MCSV (MiniMOTD and Maintenance style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p motd`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
