[package]
name = "pets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pets that follow their players and can be ridden, for Pumpkin by MCSV (MyPet style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p pets`.
# Draws models of the Models plugin when it is installed.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
