[package]
name = "placeholders"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Placeholders for Pumpkin by MCSV (PlaceholderAPI-style: %player_name%, values of other plugins, /papi)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p placeholders`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
