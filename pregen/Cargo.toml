[package]
name = "pregen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors = ["MCSV"]
description = "Chunk pre-generator for Pumpkin by MCSV (Chunky-style commands)"

# Native Pumpkin plugin (.so): the WASM plugin API of Pumpkin 0.2.2 cannot load
# or generate chunks (and its /forceload only marks chunks), so Pregen links
# pumpkin-core and must be rebuilt for every Pumpkin release (plugin API check).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
plugin = [
    "dep:pumpkin",
    "dep:pumpkin-util",
    "dep:pumpkin-api-macros",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:time",
    "dep:libc",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
pumpkin = { workspace = true, optional = true }
pumpkin-util = { workspace = true, optional = true }
pumpkin-api-macros = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
time = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
