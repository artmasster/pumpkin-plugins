[package]
name = "regions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Regions of the world with flags set by admins, for Pumpkin by MCSV (WorldGuard style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p regions`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
