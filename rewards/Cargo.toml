[package]
name = "rewards"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Daily rewards in a row and rewards for time played, for Pumpkin by MCSV"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p rewards`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
