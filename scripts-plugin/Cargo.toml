[package]
name = "scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Scripting for Pumpkin by MCSV (Skript-style language)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p scripts`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex-lite = "0.1"

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
