[package]
name = "skills"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Skills that level up with what players do, with perks, for Pumpkin by MCSV (mcMMO/AuraSkills style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p skills`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
