[package]
name = "skins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Skins for Pumpkin by MCSV (SkinsRestorer-style: real skins on offline-mode servers, /skin)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p skins`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
# `http`: skins come from Mojang (by name) and MineSkin (from an image link)
mcsv-common = { workspace = true, features = ["http"] }
