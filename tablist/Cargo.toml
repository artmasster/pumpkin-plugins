[package]
name = "tablist"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tab list for Pumpkin by MCSV (TAB-style: header/footer, names, sorting, name tags, sidebar)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p tablist`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
