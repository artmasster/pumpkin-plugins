[package]
name = "veinminer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Break a whole ore vein or a whole tree at once, for Pumpkin by MCSV (VeinMiner/TreeCapitator style)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p veinminer`.
# Leaves land of the Claims plugin alone when it is installed.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
