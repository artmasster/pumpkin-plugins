[package]
name = "voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MCSV proximity voice for Pumpkin: player positions to the voice bridge, /voice linking"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p voice`.
# Speaks the wire format of MCSV's voice bridge (the Paper and Endstone plugins speak it too).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true
