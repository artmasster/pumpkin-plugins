[package]
name = "worldtools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "World editing for Pumpkin by MCSV (WorldEdit-style: selection, set, replace, shapes, clipboard, schematics, brushes, undo)"

# WASM component plugin: build with `cargo build --release --target wasm32-wasip2 -p worldtools`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Unpacking Sponge/WorldEdit `.schem` files (gzip); pure Rust
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[target.'cfg(target_family = "wasm")'.dependencies]
pumpkin-plugin-api.workspace = true
mcsv-common.workspace = true

# Lab-only stand-in for BlockLog's receiving side (see examples/chb_probe.rs); never published.
[[example]]
name = "chb_probe"
crate-type = ["cdylib"]
